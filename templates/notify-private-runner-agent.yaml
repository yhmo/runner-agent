name: Notify private SDK doc orchestrator

run-name: notify doc orchestrator for ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  dispatch:
    name: send SDK release dispatch
    if: github.repository == 'milvus-io/<SDK_REPO>'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send repository_dispatch to runner-agent
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_REPO: milvus-io/<SDK_REPO>
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "PRIVATE_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi

          COMMIT=$(git rev-list -n 1 "$TAG")
          if [ -z "$COMMIT" ]; then
            echo "Unable to resolve commit for tag: $TAG" >&2
            exit 1
          fi

          gh api repos/yhmo/runner-agent/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "sdk-release",
            "client_payload": {
              "sdk": "<SDK_NAME>",
              "tag": "${TAG}",
              "commit": "${COMMIT}",
              "source_repo": "${SOURCE_REPO}"
            }
          }
          EOF
